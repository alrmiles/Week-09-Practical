<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <title>Splash Town</title>
</head>
<body>
    <div id="wrapper">
        <h1>Splash Town USA Tickets</h1>
        <h3>Get your one way ticket to Splash Town!</h3>
        <p id="subtext">Enter your name and age to see your ticket price</p>
        <div id="nameBox">

            <p>Name:</p>
            <input type="text" id="name" placeholder="Name"/>
        </div>
        <div id="itemBox">
            <p>Age:</p>
            <input type="text" id="age" placeholder="Age">
        </div>
        <button id="submit">Tickets Please!</button>
        <div id="reply"></div>


    </div>

<script src="js/app.js"></script>
</body>
</html>
